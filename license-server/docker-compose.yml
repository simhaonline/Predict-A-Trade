# Predict-A-Trade license server stack: Go API + Redis + PostgreSQL.
# Deploy on a VPS behind a TLS-terminating reverse proxy (nginx/Caddy/Caddy+Let's Encrypt).
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "152.53.67.111:12312:8080" # bind real IP: Plesk (159.195.54.152) proxies to this host - loopback unreachable from there
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header", "X-Healthcheck: 1", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pat_license
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pat_license
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro   # 001_init.sql applies on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pat_license"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  pg-data: